plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.mod_id }

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

loom {
    mods { "${project.mod_id}" { sourceSet sourceSets.main } }
    runs {
        client { runDir = 'run-client' }
        server { runDir = 'run-server' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    // Pure Java MP3 decoder used while a generated OGG is prepared for Minecraft's sound system.
    implementation files('libs/jlayer-1.0.1.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

jar {
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
    // Loom nests module dependencies only. JLayer is intentionally vendored,
    // so unpack it into the mod JAR for both development and release runtime.
    from({ zipTree('libs/jlayer-1.0.1.jar') }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}
